# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

name: R-CMD-check

permissions: read-all

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macos-latest, r: "release"}
          - {os: windows-latest, r: "release"}
          - {os: ubuntu-latest, r: "devel", http-user-agent: "release", rd-usage: "true"}
          - {os: ubuntu-latest, r: "release"}
          - {os: ubuntu-latest, r: "oldrel-1"}
          # the minimum R version in DESCRIPTION
          - {os: ubuntu-latest, r: "4.4"}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      # r-devel check that flagged Cdsw-class.Rd on CRAN (Rd files without \usage)
      _R_CHECK_RD_CONTENTS_USAGE_: ${{ matrix.config.rd-usage || 'false' }}

    steps:
      - uses: actions/checkout@v6.0.3

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          # "always" also routes macOS through Posit Package Manager. Workaround:
          # CRAN's macOS builder now ships zstd-compressed .tgz binaries, which the
          # pak/pkgdepends version this action installs cannot extract
          # (https://github.com/r-lib/pkgdepends/issues/485). P3M still serves gzip.
          # Revert to "true" once pkgdepends understands zstd archives.
          use-public-rspm: always

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck, any::goodpractice, any::covr
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true

      - name: Code coverage
        if: ${{ success() && runner.os == 'Linux' && matrix.config.r == 'release' }}
        # The upload depends on the Codecov service; its failures must not fail the package check.
        continue-on-error: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        run: covr::codecov(token = Sys.getenv("CODECOV_TOKEN"))
        shell: Rscript {0}

      - name: Run goodpractice report
        if: ${{ always() && runner.os == 'Linux' && matrix.config.r == 'release' }}
        continue-on-error: true
        run: |
          mkdir -p goodpractice-report
          Rscript -e 'pkgload::load_all(quiet = TRUE); result <- goodpractice::gp("."); print(result); saveRDS(result, "goodpractice-report/result.rds")' \
            > goodpractice-report/report.txt 2>&1

      - name: Upload goodpractice report
        if: ${{ always() && runner.os == 'Linux' && matrix.config.r == 'release' }}
        uses: actions/upload-artifact@v4
        with:
          name: goodpractice-${{ runner.os }}-R-${{ matrix.config.r }}
          path: goodpractice-report
          if-no-files-found: warn
